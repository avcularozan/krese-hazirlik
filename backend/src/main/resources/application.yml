spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kresehazirlik}
    username: ${DB_USER:kres}
    password: ${DB_PASSWORD:kres}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: Europe/Istanbul
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET:degistirilmeli-en-az-32-karakterlik-gizli-anahtar}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  teacher-code:
    ttl-days: 30
    max-uses: 60
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
