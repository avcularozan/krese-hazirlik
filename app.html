<title>Kreşe Hazırlık</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --ground:#F4F1F7; --surface:#FFFFFF; --surface-2:#FAF8FC; --ink:#2A2438; --muted:#6B6480;
  --line:#E7E1EE; --line-2:#F0EBF5;
  --plum:#6B4E83; --plum-ink:#5A3F70; --plum-soft:#EFE7F5;
  --honey:#B87B26; --honey-soft:#FAEFDD; --sage:#41795B; --sage-soft:#E2EFE7;
  --rose:#A8516A; --rose-soft:#F8E7EB;
  /* grafik serileri — doğrulanmış (CVD ΔE 17.5, kontrast >3:1) */
  --s1:#8433B5; --s1-fill:#EFE2F8; --s2:#0F7A57; --s2-fill:#DFEFE8;
  --shadow:0 1px 2px rgba(42,36,56,.05), 0 8px 24px -14px rgba(42,36,56,.22);
  --shadow-lg:0 2px 6px rgba(42,36,56,.06), 0 20px 44px -22px rgba(42,36,56,.35);
  --r:16px; --r-sm:10px; --r-lg:22px;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#161221; --surface:#201B2E; --surface-2:#272038; --ink:#F0EBF8; --muted:#A79FBC;
  --line:#342C48; --line-2:#2A2440;
  --plum:#C7A6DE; --plum-ink:#D9C2EA; --plum-soft:#2E2542;
  --honey:#E7BA7C; --honey-soft:#372B1C; --sage:#8FC5A6; --sage-soft:#1E3128;
  --rose:#E3A0B0; --rose-soft:#3A2530;
  --s1:#A96FD8; --s1-fill:#332345; --s2:#2FA87F; --s2-fill:#16332A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 8px rgba(0,0,0,.35), 0 24px 48px -24px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#161221; --surface:#201B2E; --surface-2:#272038; --ink:#F0EBF8; --muted:#A79FBC;
  --line:#342C48; --line-2:#2A2440;
  --plum:#C7A6DE; --plum-ink:#D9C2EA; --plum-soft:#2E2542;
  --honey:#E7BA7C; --honey-soft:#372B1C; --sage:#8FC5A6; --sage-soft:#1E3128;
  --rose:#E3A0B0; --rose-soft:#3A2530;
  --s1:#A96FD8; --s1-fill:#332345; --s2:#2FA87F; --s2-fill:#16332A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 8px rgba(0,0,0,.35), 0 24px 48px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--plum);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:460px;margin:0 auto;min-height:100dvh;padding-inline:16px;padding-block:0 104px}
@media(min-width:900px){
  body{background:radial-gradient(120% 80% at 50% -10%, var(--plum-soft), var(--ground) 62%)}
  #app{background:var(--ground);box-shadow:var(--shadow-lg)}
}

/* başlık */
.hdr{display:flex;align-items:center;gap:12px;padding-block:22px 14px;position:sticky;top:0;background:var(--ground);z-index:5}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hdr h1{font-size:25px}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--plum-soft);color:var(--plum-ink);
  display:grid;place-items:center;font-family:var(--display);font-size:19px;font-weight:700;flex:0 0 auto}

/* yüzeyler */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.flat{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-title{font-family:var(--display);font-size:17px;font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.tiny{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--plum-soft);color:var(--plum-ink)}
.pill.sage{background:var(--sage-soft);color:var(--sage)} .pill.honey{background:var(--honey-soft);color:var(--honey)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.plain{background:var(--surface-2);color:var(--muted)}

.btn{border:0;background:var(--plum);color:#fff;padding:13px 18px;border-radius:var(--r-sm);font-weight:700;width:100%;
  font-family:var(--body);transition:transform .12s ease,filter .12s ease}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#201B2E}}
:root[data-theme="dark"] .btn{color:#201B2E}
:root[data-theme="light"] .btn{color:#fff}
.btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--plum-ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:13.5px;width:auto}
.link{background:none;border:0;color:var(--plum-ink);font-weight:600;font-size:13.5px;padding:0;
  text-decoration:underline;text-underline-offset:3px}

/* bugün */
.today{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.today .mood{font-size:34px;line-height:1}
.streak{display:flex;gap:5px;margin-top:14px}
.dot{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dot.m4{background:var(--sage)} .dot.m3{background:color-mix(in srgb,var(--sage) 55%,var(--surface))}
.dot.m2{background:var(--honey)} .dot.m1{background:var(--rose)}
.journey{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.journey>i{display:block;height:100%;background:linear-gradient(90deg,var(--honey),var(--plum));border-radius:6px}

/* takvim ızgarası */
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cal span{aspect-ratio:1;border-radius:6px;background:var(--line-2);border:1px solid transparent;
  display:grid;place-items:center;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal span.m4{background:var(--sage);color:#fff;border-color:transparent}
.cal span.m3{background:color-mix(in srgb,var(--sage) 55%,var(--surface));color:var(--ink)}
.cal span.m2{background:var(--honey);color:#fff} .cal span.m1{background:var(--rose);color:#fff}
.cal span.now{border-color:var(--plum);box-shadow:0 0 0 2px var(--plum-soft)}
.cal span.future{opacity:.45}

/* seçimler */
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  background:var(--surface);text-align:left;width:100%;transition:border-color .12s,background .12s}
.choice:hover{border-color:var(--plum)}
.choice[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft)}
.choice .e{font-size:20px;line-height:1} .choice .t{font-weight:500;font-size:14.5px}
.scale{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.scale button{padding:10px 8px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:500}
.scale button[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft);color:var(--plum-ink);font-weight:700}
.scale .wide{grid-column:1/-1}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:12px 13px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface-2);
  color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:74px;resize:vertical}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* gezinme */
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}
nav .inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  color:var(--muted);font-size:10.5px;font-weight:600}
nav button[aria-current="page"]{color:var(--plum-ink)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* listeler */
.item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--plum)}
.bar.sage>i{background:var(--sage)} .bar.honey>i{background:var(--honey)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--plum-soft);border-color:var(--plum);color:var(--plum-ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.note{background:var(--surface-2);border-left:3px solid var(--plum);padding:10px 12px;
  border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13.5px;font-style:italic}
.banner{background:var(--honey-soft);color:var(--honey);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;font-weight:500}
.callout{background:var(--plum-soft);border-radius:var(--r);padding:14px;font-size:13.5px;color:var(--plum-ink)}

/* grafik */
.chart{width:100%;display:block;touch-action:pan-y}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.axis{fill:var(--muted);font-size:9.5px;font-family:var(--body)}
.gridline{stroke:var(--line);stroke-width:1}
#tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;font-size:12px;box-shadow:var(--shadow-lg);z-index:9;white-space:nowrap}

/* sayfa parçaları */
.sheet{position:fixed;inset:0;background:rgba(20,16,30,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:460px;max-height:88dvh;overflow:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.ol{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.ol li{counter-increment:s;display:flex;gap:10px;font-size:14px}
.ol li::before{content:counter(s);flex:0 0 22px;height:22px;border-radius:8px;background:var(--plum-soft);color:var(--plum-ink);
  display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--display)}
.ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.ul li{display:flex;gap:9px} .ul li::before{content:"";flex:0 0 6px;height:6px;border-radius:50%;background:var(--plum);margin-top:8px}
fieldset{border:0;padding:0;margin:0}
.hide{display:none!important}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:13.5px}
.empty svg{width:54px;height:54px;stroke:var(--line);fill:none;stroke-width:1.6;margin-bottom:8px}
</style>

<script>
/* ================= DURUM & DEPOLAMA (yalnızca bu cihaz) ================= */
const KEY="kresehazirlik.v2";
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DOW=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const fmtDate=s=>{const d=new Date(s);return d.getDate()+" "+MONTHS[d.getMonth()]};
let S=null, view="bugun", tmp={};

const blank=()=>({child:null,checkins:{},teacher:{},skills:{},readiness:{},tried:{},goals:[],code:null,demo:false});
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= TEMEL HESAPLAR ================= */
function ageMonths(bd,at=TODAY){const b=new Date(bd);let m=(at.getFullYear()-b.getFullYear())*12+(at.getMonth()-b.getMonth());
  if(at.getDate()<b.getDate())m--;return Math.max(0,m)}
function ageText(bd){const m=ageMonths(bd);return Math.floor(m/12)+" yaş "+(m%12)+" ay"}
function schoolDay(on=TODAY){if(!S.child)return 0;return dayDiff(on,new Date(S.child.startDate))+1}
function phaseOf(day){return day<=3?1:day<=7?2:day<=14?3:4}
function phaseInfo(day){return PHASES.find(p=>p.p===phaseOf(day))}
function inAdaptation(){const d=schoolDay();return d>=1&&d<=30}
function tipOfDay(){const d=schoolDay();return TIPS[Math.min(30,Math.max(1,d))]}

function entries(src="PARENT"){const o=src==="TEACHER"?S.teacher:S.checkins;
  return Object.keys(o).sort().map(k=>({date:k,...o[k]}))}
function inWindow(list,days,endOffset=0){
  const end=addDays(TODAY,-endOffset),start=addDays(end,-(days-1));
  return list.filter(e=>{const d=new Date(e.date);return d>=start&&d<=end});}
function avgItem(list,code){const v=list.map(e=>e.items&&e.items[code]).filter(x=>typeof x==="number");
  return v.length?{avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}:null}
function avgArea(list,area){const codes=ITEMS.filter(i=>i.a===area).map(i=>i.c);
  let s=0,n=0;list.forEach(e=>codes.forEach(c=>{const v=e.items&&e.items[c];if(typeof v==="number"){s+=v;n++}}));
  return n?{avg:s/n,n}:null}
function moodAvg(list){const v=list.map(e=>e.mood).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function spanDays(list,code){const d=list.filter(e=>typeof (e.items||{})[code]==="number").map(e=>new Date(e.date));
  return d.length<2?0:Math.round((Math.max(...d)-Math.min(...d))/864e5)+1}

/* Grafik serisi: gün başına genel gidişat (1-4). Eksik günler null kalır, çizgi kırılır. */
function moodSeries(days,src="PARENT"){
  const store=src==="TEACHER"?S.teacher:S.checkins,out=[];
  for(let i=days-1;i>=0;i--){const d=iso(addDays(TODAY,-i));const e=store[d];
    out.push({date:d,v:e&&e.mood?e.mood:null,note:e&&e.note?e.note:""})}
  return out;
}
/* Haftalık ortalamalar — 30/90 günlük pencerede gürültüyü azaltmak için. */
function weeklySeries(days){
  const weeks=Math.ceil(days/7),out=[];
  for(let w=weeks-1;w>=0;w--){
    const list=inWindow(entries(),7,w*7),a=moodAvg(list);
    out.push({label:w===0?"bu hafta":w+" hafta önce",v:a,n:list.length,
      date:iso(addDays(TODAY,-(w*7)))});
  }
  return out;
}

/* ================= TREND MOTORU =================
   Tek günden sonuç çıkarılmaz: bir cümle için ≥3 kayıt,
   "desteklenebilecek" demek için ≥5 kayıt ve ≥14 günlük yayılım gerekir. */
function trends(){
  const all=entries(),up=[],watch=[],support=[];
  const cur=inWindow(all,7),prev=inWindow(all,7,7);
  if(cur.length>=3&&prev.length>=3){
    const a=moodAvg(cur),b=moodAvg(prev);
    if(a-b>=.5)up.push({k:"up",t:"Son bir haftada günler genel olarak daha rahat geçmiş görünüyor."});
    else if(b-a>=.5)watch.push({k:"down",t:"Bu hafta geçen haftaya göre biraz daha zorlanmış görünüyor. Tek başına bir anlam taşımayabilir; birkaç gün daha izlemek yararlı olur."});
  }
  ITEMS.forEach(it=>{
    const c=avgItem(cur,it.c),p=avgItem(prev,it.c);
    if(!c||!p||c.n<3||p.n<3)return;
    if(c.avg-p.avg>=.6)up.push({k:"up",d:c.avg-p.avg,t:"“"+it.t+"” konusunda son iki haftada belirgin bir kolaylaşma görülüyor."});
    else if(p.avg-c.avg>=.6)watch.push({k:"watch",d:p.avg-c.avg,t:"“"+it.t+"” bu hafta geçen haftaya göre daha zorlayıcı görünüyor."});
  });
  /* Desteklenebilecek maddeler alan bazında toplanır — aynı cümle art arda tekrarlanmaz. */
  const m30=inWindow(all,30),byArea={};
  ITEMS.forEach(it=>{
    const w=avgItem(m30,it.c);
    if(w&&w.n>=5&&w.avg<1.5&&spanDays(m30,it.c)>=14)
      (byArea[it.a]||(byArea[it.a]=[])).push({t:it.t.toLocaleLowerCase("tr"),avg:w.avg});
  });
  Object.entries(byArea).sort((a,b)=>a[1][0].avg-b[1][0].avg).slice(0,2).forEach(([area,list])=>{
    list.sort((a,b)=>a.avg-b.avg);
    const names=list.slice(0,2).map(x=>"“"+x.t+"”").join(" ve ");
    const rest=list.length>2?" (ve "+(list.length-2)+" madde daha)":"";
    support.push({k:"support",t:AREA_N[area]+" alanında "+names+rest+" son haftalarda zorlanma sürüyor. Bu alanı öğretmeniyle birlikte gözlemlemek yararlı olabilir."});
  });
  up.sort((a,b)=>(b.d||9)-(a.d||9)); watch.sort((a,b)=>(b.d||9)-(a.d||9));
  return [...up.slice(0,3),...watch.slice(0,2),...support];
}
function referralHint(){
  const m30=inWindow(entries(),30);
  const weak=ITEMS.filter(it=>{const w=avgItem(m30,it.c);return w&&w.n>=5&&w.avg<1.2&&spanDays(m30,it.c)>=21});
  const areas=new Set(weak.map(i=>i.a));
  return areas.size>=3?"Birden fazla alanda üç haftadır süren bir zorlanma görünüyor. Bu durumun bir süre daha devam etmesi halinde öğretmeninizle ve uygun bir çocuk gelişimi uzmanıyla görüşmeniz yararlı olabilir.":null;
}

/* Alan puanları: günlük kayıtlar + beceri gözlemleri, 0-3 ölçeğinde. */
function areaScores(days=30){
  const list=inWindow(entries(),days),out={};
  AREAS.forEach(a=>{
    const ci=avgArea(list,a.c);
    const sk=Object.entries(S.skills).map(([c,o])=>({s:SKILLS.find(x=>x.c===c),o}))
      .filter(x=>x.s&&x.s.a===a.c&&LEVEL[x.o.level]&&LEVEL[x.o.level].v!==null);
    let s=0,n=0;
    if(ci){s+=ci.avg*ci.n;n+=ci.n}
    sk.forEach(x=>{s+=LEVEL[x.o.level].v;n++});
    out[a.c]=n?{avg:s/n,n}:null;
  });
  return out;
}
function bucketOf(avg){return avg>=2.4?"strong":avg>=1.5?"emerging":"support"}
function buckets(){
  const sc=areaScores(30),strong=[],emerging=[],support=[];
  AREAS.forEach(a=>{const r=sc[a.c];if(!r||r.n<3)return;
    const row={...r,...a,count:r.n};
    ({strong,emerging,support})[bucketOf(r.avg)].push(row)});
  [strong,emerging,support].forEach(l=>l.sort((x,y)=>y.avg-x.avg));
  return {strong,emerging,support,scores:sc};
}
function biggestGain(windowDays=14){
  const all=entries(),cur=inWindow(all,windowDays),prev=inWindow(all,windowDays,windowDays);let best=null;
  ITEMS.forEach(it=>{const c=avgItem(cur,it.c),p=avgItem(prev,it.c);
    if(c&&p&&c.n>=3&&p.n>=3){const d=c.avg-p.avg;if(d>.3&&(!best||d>best.d))best={d,t:it.t,area:it.a}}});
  return best;
}
function suggestedActivities(n=6,areaFilter=null){
  const m=S.child?ageMonths(S.child.birthDate):36;
  const b=buckets();
  const focus=[...b.support.map(x=>x.c),...(S.child?.focusAreas||[]),...b.emerging.map(x=>x.c)];
  let fit=ACTS.filter(a=>m>=a.min&&m<=a.max);
  if(areaFilter)fit=fit.filter(a=>a.a===areaFilter);
  const ranked=fit.map(a=>({a,r:(focus.indexOf(a.a)===-1?99:focus.indexOf(a.a))+(S.tried[a.c]?20:0)}))
    .sort((x,y)=>x.r-y.r);
  return ranked.slice(0,n).map(x=>x.a);
}

/* Dinamik soru seçimi: her gün aynı uzun form gösterilmez. */
function pickQuestions(){
  const day=Math.max(1,schoolDay()),ph=phaseOf(day),all=entries();
  const pool=ITEMS.filter(i=>i.p<=ph);
  const recent=inWindow(all,3).map(e=>e.items||{});
  const newly=pool.filter(i=>i.p===ph&&ph>1);
  const last=all.slice(-1)[0];
  const score=i=>{
    let s=0;
    s-=recent.filter(r=>typeof r[i.c]==="number").length*2;
    const lv=last&&last.items?last.items[i.c]:undefined;
    if(typeof lv==="number"&&lv<=1)s+=6;
    if(newly.includes(i))s+=5;
    if((S.child?.focusAreas||[]).includes(i.a))s+=2;
    if(ph===1)s+=3;
    const w7=avgItem(inWindow(all,7),i.c);
    if(w7&&w7.avg>=2.6&&w7.n>=3)s-=5;
    return s+Math.random()*1.2;
  };
  return pool.sort((a,b)=>score(b)-score(a)).slice(0,day<=3?5:4);
}

/* Aylık hedefler — en fazla 3, küçük ve somut. */
const GOAL_TEXT={
 sosyal:"Akran etkileşimi için günde bir kez kısa bir sıra alma oyunu",
 dil:"Her akşam “günün üç şeyi”ni birlikte anlatmak",
 dikkat:"Günde bir kez iki adımlı yönerge oyunu",
 ince:"Haftada üç kez 10 dakikalık el çalışması (hamur, mandal)",
 kaba:"Okul dönüşü 15 dakika hareket",
 bilis:"Akşamları birlikte bir yapboz",
 ozbakim:"Çantayı her akşam kendisi hazırlasın",
 oyun:"Günde 15 dakika çocuğun kurduğu oyuna eşlik etmek",
 duygu:"Sakin anlarda balon nefesi alıştırması"};
function goalText(g){return g&&g.text?g.text:(GOAL_TEXT[g&&g.c]||"Bu ay için küçük bir adım")}
function monthlyGoals(){const b=buckets();return [...b.support,...b.emerging].slice(0,3)}

/* Okul olgunluğu tablosu */
function readinessBuckets(){
  const strong=[],em=[],sp=[];
  READY.forEach(a=>{
    const vals=a.i.map((_,i)=>S.readiness[a.c+"."+i]).filter(v=>typeof v==="number");
    if(!vals.length)return;
    const avg=vals.reduce((x,y)=>x+y,0)/vals.length;
    const row={...a,avg,n:vals.length};
    (avg>=2.5?strong:avg>=1.5?em:sp).push(row);
  });
  return {strong,em,sp};
}

/* ================= GRAFİK ================= */
const MOOD_LABEL={4:"Rahat geçti",3:"İyiydi",2:"Zorlandı",1:"Zor gün"};
function lineChart(series,opts={}){
  const W=340,H=152,L=30,R=12,T=12,B=26;
  const pts=series[0].data,n=pts.length;
  const x=i=>L+(n<=1?0:i*(W-L-R)/(n-1));
  const y=v=>T+(4-v)/3*(H-T-B);
  const path=d=>{let s="",open=false;
    d.forEach((p,i)=>{if(p.v==null){open=false;return}s+=(open?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)+" ";open=true});
    return s.trim()};
  const areaPath=d=>{const k=d.map((p,i)=>({...p,i})).filter(p=>p.v!=null);
    if(k.length<2)return "";
    return "M"+x(k[0].i).toFixed(1)+" "+(H-B)+" "+k.map(p=>"L"+x(p.i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ")
      +" L"+x(k[k.length-1].i).toFixed(1)+" "+(H-B)+" Z"};
  const grid=[1,2,3,4].map(v=>`<line class="gridline" x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}"/>`).join("");
  const ylabs=[[4,"Rahat"],[1,"Zor"]].map(([v,t])=>
    `<text class="axis" x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${t}</text>`).join("");
  const idx=[0,Math.floor((n-1)/2),n-1].filter((v,i,ar)=>ar.indexOf(v)===i);
  const xlabs=idx.map(i=>`<text class="axis" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${esc(pts[i].label||fmtDate(pts[i].date))}</text>`).join("");
  const marks=series.map((s,si)=>{
    const k=s.data.map((p,i)=>({...p,i})).filter(p=>p.v!=null);
    const last=k[k.length-1];
    return `${si===0&&opts.fill!==false?`<path d="${areaPath(s.data)}" fill="var(--s${si+1}-fill)"/>`:""}
      <path d="${path(s.data)}" fill="none" stroke="var(--s${si+1})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${n<=14?k.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.4" fill="var(--s${si+1})" stroke="var(--surface)" stroke-width="2"/>`).join(""):""}
      ${last?`<circle cx="${x(last.i).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="5" fill="var(--s${si+1})" stroke="var(--surface)" stroke-width="2"/>`:""}`;
  }).join("");
  const hit=pts.map((p,i)=>`<rect x="${(x(i)-(W-L-R)/(2*Math.max(1,n-1))).toFixed(1)}" y="${T}"
     width="${((W-L-R)/Math.max(1,n-1)).toFixed(1)}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.alt||"Genel gidişat")}"
     data-chart='${esc(JSON.stringify({labels:pts.map(p=>p.label||fmtDate(p.date)),
       series:series.map(s=>({name:s.name,data:s.data.map(p=>p.v)}))}))}'>
    ${grid}${ylabs}${xlabs}${marks}
    <g class="hit">${hit}</g></svg>`;
}
function bindChartHover(){
  document.querySelectorAll("svg.chart").forEach(svg=>{
    let meta;try{meta=JSON.parse(svg.dataset.chart)}catch(e){return}
    const show=e=>{
      const r=e.target.closest("rect[data-i]");if(!r)return;
      const i=+r.dataset.i;
      let tip=document.getElementById("tip");
      if(!tip){tip=document.createElement("div");tip.id="tip";document.body.appendChild(tip)}
      const rows=meta.series.map((s,si)=>{
        const v=s.data[i];
        return `<div style="display:flex;gap:7px;align-items:center">
          <i style="width:9px;height:9px;border-radius:2px;background:var(--s${si+1});display:inline-block"></i>
          <span>${esc(s.name)}: <b>${v==null?"kayıt yok":esc(MOOD_LABEL[Math.round(v)]||v.toFixed(1))}</b></span></div>`}).join("");
      tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${esc(meta.labels[i])}</div>${rows}`;
      const box=r.getBoundingClientRect();
      tip.style.left=Math.max(8,Math.min(window.innerWidth-tip.offsetWidth-8,box.left+box.width/2-tip.offsetWidth/2))+"px";
      tip.style.top=(box.top+window.scrollY-tip.offsetHeight-8)+"px";
    };
    svg.addEventListener("pointermove",show);
    svg.addEventListener("pointerdown",show);
    svg.addEventListener("pointerleave",()=>{const t=document.getElementById("tip");if(t)t.remove()});
  });
}

function comparison(){
  const te=entries("TEACHER");if(!te.length)return null;
  const pe=entries(),rows=[];
  ITEMS.forEach(it=>{const p=avgItem(inWindow(pe,30),it.c),t=avgItem(inWindow(te,30),it.c);
    if(p&&t)rows.push({t:it.t,p:p.avg,t2:t.avg,d:t.avg-p.avg})});
  if(!rows.length)return null;
  rows.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const top=rows[0];let note=null;
  if(top.d>=.7)note=`“${top.t}” ebeveyn açısından zorlayıcı görünmesine rağmen öğretmen gözlemlerine göre sınıf içinde daha kolay ilerliyor. İki ortamın farklı olması olağandır.`;
  else if(top.d<=-.7)note=`“${top.t}” evde daha rahat, sınıf ortamında ise biraz daha zorlayıcı görünüyor. Öğretmeniyle bu maddeyi konuşmak yararlı olabilir.`;
  return {rows:rows.slice(0,4),note};
}

<script>
/* ================= SAYFA PARÇASI (sheet) ================= */
let sheetEl=null;
function sheet(html){
  close();
  sheetEl=document.createElement("div");sheetEl.className="sheet";
  sheetEl.innerHTML=`<div class="panel"><div class="grab"></div><div id="sheet-body">${html}</div></div>`;
  document.body.appendChild(sheetEl);
  sheetEl.addEventListener("click",e=>{if(e.target===sheetEl)close()});
  document.body.style.overflow="hidden";
  bindChartHover();
}
function refreshSheet(html){const b=document.getElementById("sheet-body");if(b){b.innerHTML=html;bindChartHover()}}
function close(){if(sheetEl){sheetEl.remove();sheetEl=null;document.body.style.overflow=""}
  const t=document.getElementById("tip");if(t)t.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

/* ================= OLAYLAR ================= */
function keepObInputs(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():undefined};
  const d=tmp.ob;if(!d)return;
  const map={"ob-name":"nickname","ob-bd":"birthDate","ob-sd":"startDate","ob-grp":"group","ob-prev":"prev","ob-hrs":"hours"};
  Object.entries(map).forEach(([id,k])=>{const v=g(id);if(v!==undefined)d[k]=v});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;

  if(d.nav){go(d.nav);return}
  if(d.focus){const f=tmp.ob.focusAreas;const i=f.indexOf(d.focus);i<0?f.push(d.focus):f.splice(i,1);render();return}
  if(d.pfocus){const f=S.child.focusAreas||(S.child.focusAreas=[]);const i=f.indexOf(d.pfocus);
    i<0?f.push(d.pfocus):f.splice(i,1);save();render();return}
  if(d.area){sheet(areaHtml(d.area));return}
  if(d.actarea){tmp.actArea=d.actarea;render();return}
  if(d.dur){tmp.actDur=d.dur;render();return}
  if(d.win){tmp.win=+d.win;render();return}
  if(d.openAct){sheet(actHtml(d.openAct));return}
  if(d.try){const c=d.try;
    if(S.tried[c])delete S.tried[c]; else S.tried[c]=iso(TODAY);
    save(); if(sheetEl)refreshSheet(actHtml(c)); else render(); return}
  if(d.mood){tmp.ci.mood=+d.mood;
    const n=document.getElementById("ci-note");if(n)tmp.ci.note=n.value;
    refreshSheet(checkinHtml());return}
  if(d.item){const v=d.val==="na"?null:+d.val;
    tmp.ci.items[d.item]=tmp.ci.items[d.item]===v?undefined:v;
    if(tmp.ci.items[d.item]===undefined)delete tmp.ci.items[d.item];
    const n=document.getElementById("ci-note");if(n)tmp.ci.note=n.value;
    refreshSheet(checkinHtml());return}
  if(d.titem){const v=d.val==="na"?null:+d.val;tmp.tobs.items[d.titem]=v;
    const n=document.getElementById("t-note"),a=document.getElementById("t-alias");
    if(n)tmp.tobs.note=n.value; if(a)tmp.tobs.alias=a.value;
    refreshSheet(teacherHtml());return}
  if(d.skill){const cur=S.skills[d.skill];
    if(cur&&cur.level===d.lvl)delete S.skills[d.skill]; else S.skills[d.skill]={level:d.lvl,date:iso(TODAY)};
    save();
    const areaCode=(SKILLS.find(s=>s.c===d.skill)||{}).a;
    if(sheetEl&&areaCode)refreshSheet(areaHtml(areaCode)); else render();
    return}
  if(d.ready){S.readiness[d.ready]=+d.val;save();refreshSheet(readinessHtml());return}

  const a=d.act;
  if(a==="close")close();
  else if(a==="checkin")openCheckin();
  else if(a==="journey")sheet(journeyHtml());
  else if(a==="go-rapor")go("rapor");
  else if(a==="readiness")sheet(readinessHtml());
  else if(a==="teacher")openTeacher();
  else if(a==="revoke"){S.code=String(Math.floor(100000+Math.random()*900000));save();refreshSheet(teacherHtml())}
  else if(a==="ob-next"){keepObInputs();
    if(tmp.ob.step===1&&(!tmp.ob.nickname||!tmp.ob.birthDate)){alert("Devam etmek için ad/takma ad ve doğum tarihi gerekiyor.");return}
    if(tmp.ob.step===1&&new Date(tmp.ob.birthDate)>TODAY){alert("Doğum tarihi bugünden ileri olamaz.");return}
    tmp.ob.step++;render()}
  else if(a==="ob-back"){keepObInputs();tmp.ob.step--;render()}
  else if(a==="ob-save")saveOnboard();
  else if(a==="ci-save")saveCheckin();
  else if(a==="t-save")saveTeacher();
  else if(a==="demo"){seed();close();go("bugun")}
  else if(a==="export")exportData();
  else if(a==="wipe")wipe();
});
</script>

/* ================= ÖRNEK VERİ (3 yaş, kreşe yeni başlamış) ================= */
function seed(){
  S=blank();S.demo=true;
  const start=addDays(TODAY,-28);
  S.child={nickname:"Ada",birthDate:iso(new Date(TODAY.getFullYear()-3,TODAY.getMonth()-4,12)),
    startDate:iso(start),group:"3 yaş grubu",prev:"Yok",hours:"Yarım gün (3-4 saat)",
    focusAreas:["duygu","sosyal","ince"]};
  const rnd=(s=>()=>((s=s*16807%2147483647)/2147483647))(20260914);
  const base={},growth={};
  ITEMS.forEach(i=>{base[i.c]=.8+rnd()*.7;growth[i.c]=.03+rnd()*.05});
  // uyum süreciyle en çok değişen maddeler
  Object.assign(growth,{evden:.075,ayrilik:.085,sakin:.08,destek:.075,giris:.07,guven:.07});
  Object.assign(base,{ayrilik:.4,sakin:.5,evden:.8,yemek:.9});

  for(let day=1;day<=28;day++){
    const date=iso(addDays(start,day-1));
    const dow=new Date(date).getDay(); if(dow===0||dow===6)continue;   // hafta sonu okul yok
    if(day===12||day===20)continue;                                    // birkaç gün kayıt girilmemiş
    const ph=phaseOf(day);
    const pool=ITEMS.filter(i=>i.p<=ph);
    const picked=pool.filter(()=>rnd()<(ph===1?.9:.4)).slice(0,ph===1?8:5);
    const items={};
    picked.forEach(i=>{
      if(rnd()<.06){items[i.c]=null;return}
      let v=base[i.c]+growth[i.c]*day+(rnd()-.5)*.9;
      if(i.c==="yemek")v=Math.min(v,1.35);                             // süregelen zorlanma alanı
      items[i.c]=Math.max(0,Math.min(3,Math.round(v)));
    });
    const vals=Object.values(items).filter(v=>typeof v==="number");
    const m=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:1.5;
    S.checkins[date]={mood:Math.max(1,Math.min(4,Math.round(m)+1)),items,
      note:SEED_NOTES[day]||"",qs:picked.map(p=>p.c),source:"PARENT"};
  }
  [7,17,26].forEach(day=>{
    const date=iso(addDays(start,day-1));
    const items={ayrilik:Math.min(3,1+Math.round(day/12)),sakin:Math.min(3,1+Math.round(day/10)),
      oyun:Math.min(3,2+(day>20?1:0)),yemek:1,akran:day>14?2:1,yonerge:2};
    const vals=Object.values(items);
    S.teacher[date]={mood:Math.max(1,Math.min(4,Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)+1)),
      alias:"Zeynep Öğretmen",source:"TEACHER",items,
      note:day===26?"Sınıfa girdikten 5 dakika sonra oyuna katılıyor. Yemekte seçici davranıyor.":
           day===17?"Sabah kısa süre ağladı, ardından kendi etkinliğini seçti.":""};
  });
  const m=ageMonths(S.child.birthDate);
  SKILLS.filter(s=>m>=s.min&&m<=s.max).forEach((s,i)=>{
    if(i%3===2)return;
    S.skills[s.c]={level:["IND","REM","HELP","NOT"][Math.min(3,Math.floor(rnd()*3.3))],
      date:iso(addDays(TODAY,-(i%10)))};
  });
  S.tried={a5:iso(addDays(TODAY,-6)),b8:iso(addDays(TODAY,-2))};
  save();
}
const SEED_NOTES={
 2:"Kapıda ağladı, öğretmeni aldıktan sonra uzun süre sakinleşememiş.",
 5:"Bugün kapıda ağladı fakat öğretmeni aldıktan 5 dakika sonra sakinleşmiş.",
 9:"Sabah çantasını kendi taşımak istedi.",
 14:"Sınıfa girerken el salladı, ağlamadı.",
 18:"Eve dönüşte Deniz adında bir arkadaşından bahsetti.",
 23:"Yemekte yine çok az yemiş, öğretmeni de aynısını söylüyor.",
 27:"Bugün kapıdan koşarak girdi."};

/* ================= BAŞLAT ================= */
S=load();
if(!S||!S.child){ S=blank(); seed(); }
["readiness","teacher","skills","tried","goals","checkins"].forEach(k=>{ if(!S[k])S[k]=k==="goals"?[]:{} });
render();
</script>
