services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kresehazirlik
      POSTGRES_USER: kres
      POSTGRES_PASSWORD: kres
    ports: ["5432:5432"]
    volumes: ["kres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kres -d kresehazirlik"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/kresehazirlik
      DB_USER: kres
      DB_PASSWORD: kres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanimlanmali}
    ports: ["8080:8080"]

volumes:
  kres-data:
